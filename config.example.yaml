# change the brand / accent color without editing the app
brand_name: rss2slideshow
accent_color: "#8b3932"

# default/first feed. add more in content/feeds.txt, one URL per line.
# want ONLY feeds.txt? set rss_url to "" and put all your feeds there.
rss_url: https://www.hessenschau.de/index.rss
news_source_label: Hessenschau
max_articles: 5
refresh_minutes: 10

# turn on after checking the image usage rights for your feeds
news_images: false
