# Public demo approved by the customer. /demo/logserv only.
# One kiosk, one feed list. Only the LOOK changes in the demo.
brand_name: "Bistro Connect"
tagline: ""
layout: bistro
font_family: Calibri     # fallback: Carlito / Arial; no proprietary font in git
accent_color: "#ec6608"
header_color: "#ffef85" # yellow-first header, orange stays a small accent
footer_color: "#ffdd00"
background_color: "#fff8cf" # warmer yellow, not full saturated everywhere
text_color: "#202020"
logo_mode: normal
show_group_logo: false
source_in_header: true
# logo.svgz = customer's vector artwork (EPS converted to tightly cropped SVG,
# compressed for the web); logo.png is kept only as a fallback.
# other customers can simply drop a regular logo.svg into their branding folder.
# header is deliberately Bistro Connect + current news source, no group logo
# company names are real text instead of the tiny almost-invisible PNG
footer_names:
  - "Logserv"
  - "Friedrich Friedrich"
  - "Höhne-Grass"
  - "J. & G. Adrian"
  - "KS Büromöbel"
# no "guten Appetit" overlay in the first branding round
