<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RSS kiosk</title>
<style>
:root {
  --accent:#8b3932; --paper:#f8f7f3; --ink:#242424;
  --header-bg:#fff; --footer-bg:#fff; --body-font:Arial,Helvetica,sans-serif;
  --heading-font:Georgia,serif;
}
* { box-sizing:border-box; }
html,body { margin:0; width:100%; height:100%; overflow:hidden; }
body { color:var(--ink); background:var(--paper); font-family:var(--body-font); }
#page { width:100vw; height:100vh; height:100dvh; display:grid;
  grid-template-rows:clamp(84px,12vh,130px) minmax(0,1fr) clamp(40px,6vh,62px); }
header { display:flex; align-items:center; justify-content:space-between; gap:2vw;
  padding:10px clamp(18px,3vw,58px); background:var(--header-bg);
  border-top:clamp(4px,.7vh,8px) solid var(--accent);
  border-bottom:1px solid #d7d0bf; min-width:0; }
.identity { display:flex; align-items:center; gap:clamp(10px,1.4vw,25px); min-width:0; }
#logo { display:none; width:clamp(62px,8.5vh,92px); height:clamp(62px,8.5vh,92px);
  object-fit:contain; flex:none; border-radius:0; }
body.bistro-logo #logo { border-radius:50%; }
body.wide-logo #logo { width:min(28vw,390px); height:auto; max-height:80px; object-fit:contain; }
body.wide-logo #brand, body.wide-logo #tagline { display:none !important; }
.brand-copy { display:flex; flex-direction:column; gap:3px; min-width:0; }
#brand { font-size:clamp(23px,2.35vw,43px); line-height:1.1; font-weight:700;
  letter-spacing:-.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#tagline { display:none; font-size:clamp(12px,.98vw,18px); letter-spacing:.06em; }
.header-right { display:flex; align-items:center; gap:clamp(18px,2.2vw,40px); flex:none; min-width:0; }
#logo.ready { display:block; }
/* the group wordmark has lots of horizontal detail: give it real width, preserve proportions */
#group-logo { display:none; width:clamp(250px,22vw,410px); height:clamp(50px,7.5vh,75px);
  object-fit:contain; object-position:center; flex:none; }
/* this is the logo WITH claim, not the many-company text banner */
.clock { text-align:right; font-variant-numeric:tabular-nums; flex:none; }
#time { display:block; font-weight:700; font-size:clamp(20px,1.7vw,33px); line-height:1.1; }
#date { display:block; font-size:clamp(11px,.8vw,15px); margin-top:5px; }
main { min-width:0; min-height:0; padding:clamp(18px,2.1vw,42px) clamp(18px,3vw,58px);
  display:grid; grid-template-rows:auto minmax(0,1fr); gap:clamp(14px,2vh,26px); }
.meta { display:flex; align-items:baseline; justify-content:space-between; gap:2vw; min-width:0;
  border-bottom:1px solid rgba(30,30,30,.18); padding-bottom:clamp(9px,1.2vh,14px); }
#source { font-size:clamp(14px,1.1vw,21px); line-height:1.2; font-weight:700; color:var(--accent);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#published { font-size:clamp(12px,.85vw,16px); white-space:nowrap; flex:none; opacity:.75; }
.story { display:grid; grid-template-columns:minmax(0,43%) minmax(0,1fr);
  gap:clamp(22px,3vw,60px); min-width:0; min-height:0; align-items:start; }
.visual { min-width:0; height:min(100%,53vh); max-height:590px; display:flex;
  align-items:center; justify-content:center; overflow:hidden; background:#fffaf2;
  border:1px solid rgba(30,30,30,.12); }
#picture { width:100%; height:100%; object-fit:contain; display:none; }
.copy { min-width:0; min-height:0; display:flex; flex-direction:column;
  gap:clamp(12px,2.2vh,30px); padding-top:clamp(0px,.5vh,8px); }
h1 { font-family:var(--heading-font); margin:0; font-size:clamp(28px,3.05vw,59px);
  font-weight:700; line-height:1.14; letter-spacing:-.022em;
  overflow-wrap:break-word; display:-webkit-box; -webkit-box-orient:vertical;
  -webkit-line-clamp:5; overflow:hidden; }
#summary { margin:0; font-size:clamp(16px,1.43vw,27px); line-height:1.43;
  display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:6; overflow:hidden; }
.story.no-picture { grid-template-columns:1fr; }
.story.no-picture .visual { display:none; }
.story.no-picture .copy { max-width:min(100%,1100px); }
footer { display:flex; align-items:center; justify-content:space-between; gap:2vw;
  padding:0 clamp(18px,3vw,58px); background:var(--footer-bg);
  border-top:2px solid var(--accent); font-size:clamp(12px,.95vw,18px); min-width:0; }
#footer { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#counter { white-space:nowrap; flex:none; font-variant-numeric:tabular-nums; font-weight:700; }
#footer-banner { display:none; width:min(61vw,970px); height:clamp(30px,4.4vh,46px);
  object-fit:contain; min-width:0; margin:0 auto; }
#footer-banner.ready { display:block; }
#footer-names { display:none; min-width:0; align-items:center; justify-content:center;
  align-content:center; flex-wrap:wrap; column-gap:clamp(10px,1.15vw,22px); row-gap:2px;
  font-size:clamp(12px,.86vw,17px); font-weight:700; line-height:1.15; }
#footer-names .company { white-space:nowrap; }
#footer-names .company + .company::before { content:"·"; padding-right:clamp(10px,1.15vw,22px);
  color:var(--accent); }
footer.has-names { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,4fr) auto;
  align-items:center; column-gap:clamp(12px,1.5vw,28px); }
footer.has-names #footer-names { display:flex; }
footer.has-names #footer { font-size:clamp(12px,.85vw,16px); }
footer.has-names #footer-banner { display:none; }
@media (max-width:1400px) {
  footer.has-names { grid-template-columns:minmax(0,.65fr) minmax(0,4fr) auto; }
  #footer-names { font-size:clamp(11px,.85vw,14px); column-gap:8px; }
  #footer-names .company + .company::before { padding-right:8px; }
}
@media (max-width:760px) {
  footer.has-names #footer { display:none; }
  footer.has-names { grid-template-columns:minmax(0,1fr) auto; }
  #footer-names { justify-content:flex-start; }
}
footer.has-banner { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,2.5fr) auto;
  align-items:center; column-gap:clamp(12px,1.5vw,28px); }
footer.has-banner #footer { font-size:clamp(11px,.8vw,15px); }
@media (max-width:1180px) {
  #footer-banner.ready { display:none; }
  footer.has-banner { display:flex; }
}

/* the optional group logo stays secondary and is only shown when it actually fits */
@media (min-width:1600px) and (min-height:800px) {
  body.has-group #group-logo.ready { display:block; }
}
@media (max-width:940px) {
  .story { grid-template-columns:minmax(0,40%) minmax(0,1fr); gap:20px; }
  h1 { font-size:clamp(26px,3.2vw,38px); }
  #summary { font-size:clamp(15px,1.65vw,20px); }
}
@media (max-width:680px) and (orientation:portrait) {
  #page { grid-template-rows:76px minmax(0,1fr) 40px; }
  #logo { width:55px; height:55px; }
  #brand { font-size:20px; }
  .clock #date { display:none; }
  main { padding:13px 16px; gap:12px; }
  #published { display:none; }
  .story { grid-template-columns:1fr; grid-template-rows:minmax(0,38%) minmax(0,1fr); gap:14px; }
  .visual { height:100%; }
  h1 { font-size:clamp(22px,5vw,34px); -webkit-line-clamp:4; }
  #summary { font-size:clamp(14px,3vw,19px); -webkit-line-clamp:4; }
  .story.no-picture { grid-template-rows:1fr; }
}
</style>
</head>
<body>
<div id="page">
<header>
  <div class="identity">
    <img id="logo" alt="">
    <div class="brand-copy"><div id="brand">RSS kiosk</div><div id="tagline"></div></div>
  </div>
  <div class="header-right">
    <img id="group-logo" alt="Friedrich Friedrich – Gruppenlogo mit Claim">
    <div class="clock"><span id="time">--:--</span><span id="date"></span></div>
  </div>
</header>
<main>
  <div class="meta"><span id="source">Nachrichten</span><span id="published"></span></div>
  <article class="story no-picture" id="story">
    <div class="visual"><img id="picture" alt=""></div>
    <div class="copy"><h1 id="headline">Nachrichten werden geladen …</h1><p id="summary"></p></div>
  </article>
</main>
<footer id="page-footer"><span id="footer">RSS reader</span><div id="footer-names" aria-label="Unternehmensgruppe"></div><img id="footer-banner" alt="Unternehmensgruppe"><span id="counter"></span></footer>
</div>
<script>
"use strict";
const el = id => document.getElementById(id);
const demoProfile = /^\/demo\/[a-z0-9-]{1,40}\/?$/.test(location.pathname) ?
  location.pathname.split("/").filter(Boolean).pop() : "";
let articles = [], index = 0, displayedId = "", seconds = 20, timer = null;
let zone = "Europe/Berlin", syncTime = null, syncAt = 0, brand = "RSS reader";
let currentFontUrl = "", fontRequest = 0, photoRequest = 0;

function now() {
  return syncTime === null ? new Date() : new Date(syncTime + performance.now() - syncAt);
}
function clock() {
  const date = now();
  try {
    el("time").textContent = new Intl.DateTimeFormat("de-DE",
      {timeZone:zone, hour:"2-digit", minute:"2-digit", second:"2-digit"}).format(date);
    el("date").textContent = new Intl.DateTimeFormat("de-DE",
      {timeZone:zone, weekday:"short", day:"2-digit", month:"2-digit", year:"numeric"}).format(date);
  } catch (_) {
    el("time").textContent = date.toLocaleTimeString();
    el("date").textContent = date.toLocaleDateString();
  }
}
function setImage(id, url) {
  const image = el(id);
  if (image.dataset.url === url) return;
  image.dataset.url = url;
  image.classList.remove("ready");
  image.removeAttribute("src");
  if (!url) return;
  image.onload = () => { if (image.dataset.url === url) image.classList.add("ready"); };
  image.onerror = () => { if (image.dataset.url === url) image.classList.remove("ready"); };
  image.src = url;
}
function show() {
  if (!articles.length) return;
  const story = articles[index % articles.length];
  index = (index + 1) % articles.length;
  displayedId = story.id;
  el("source").textContent = story.source || "RSS";
  el("headline").textContent = story.title || "";
  el("summary").textContent = story.summary || "";
  el("footer").textContent = brand + "  ·  " + (story.source || "RSS");
  el("counter").textContent = String(((index - 1 + articles.length) % articles.length) + 1).padStart(2,"0") +
    " / " + String(articles.length).padStart(2,"0");
  el("published").textContent = "";
  if (story.published) {
    const d = new Date(story.published);
    if (!Number.isNaN(d.getTime())) {
      try {
        el("published").textContent = new Intl.DateTimeFormat("de-DE",
          {timeZone:zone, day:"2-digit", month:"2-digit", year:"numeric",
           hour:"2-digit", minute:"2-digit"}).format(d);
      } catch (_) { el("published").textContent = d.toLocaleString(); }
    }
  }
  const image = el("picture"), request = ++photoRequest;
  image.style.display = "none";
  image.removeAttribute("src");
  el("story").classList.add("no-picture");
  if (story.image && /^https:\/\//i.test(story.image)) {
    image.onload = () => {
      if (request !== photoRequest) return;
      image.style.display = "block";
      el("story").classList.remove("no-picture");
    };
    image.onerror = () => {
      if (request !== photoRequest) return;
      image.style.display = "none";
      el("story").classList.add("no-picture");
    };
    image.src = story.image;
  }
}
function applySettings(data) {
  zone = data.timezone || zone;
  syncTime = Number(data.server_time_ms);
  syncAt = performance.now();
  brand = data.brand_name || brand;
  el("brand").textContent = brand;
  document.title = brand;
  const tagline = String(data.tagline || "").trim();
  el("tagline").textContent = tagline;
  el("tagline").style.display = tagline ? "block" : "none";
  const colors = {"--accent":data.accent_color, "--paper":data.background_color,
    "--ink":data.text_color, "--header-bg":data.header_color, "--footer-bg":data.footer_color};
  for (const [key, value] of Object.entries(colors)) {
    if (/^#[0-9a-fA-F]{6}$/.test(value || "")) {
      document.documentElement.style.setProperty(key, value);
    } else if (key === "--header-bg" || key === "--footer-bg") {
      document.documentElement.style.setProperty(key, "#fff");
    }
  }
  document.body.classList.toggle("bistro-logo", data.layout === "bistro");
  document.body.classList.toggle("wide-logo", data.logo_mode === "wide");
  setImage("logo", data.logo_url || "");
  const groupUrl = data.group_logo_url || "";
  document.body.classList.toggle("has-group", !!groupUrl);
  setImage("group-logo", groupUrl);
  const names = Array.isArray(data.footer_names) ? data.footer_names.filter(name => typeof name === "string" && name.trim()) : [];
  const namesElement = el("footer-names");
  namesElement.replaceChildren();
  for (const name of names) {
    const span = document.createElement("span");
    span.className = "company";
    span.textContent = name;
    namesElement.appendChild(span);
  }
  const hasNames = names.length > 0;
  el("page-footer").classList.toggle("has-names", hasNames);
  const bannerUrl = hasNames ? "" : (data.footer_banner_url || "");
  el("page-footer").classList.toggle("has-banner", !!bannerUrl);
  setImage("footer-banner", bannerUrl);

  const name = String(data.font_family || "news");
  const presets = {
    news:["Arial,Helvetica,sans-serif","Georgia,serif"],
    sans:["Arial,Helvetica,sans-serif","Arial,Helvetica,sans-serif"],
    serif:["Georgia,serif","Georgia,serif"],
    mono:['"Courier New",monospace','"Courier New",monospace'],
    Calibri:['Calibri,Carlito,Arial,sans-serif','Calibri,Carlito,Arial,sans-serif']
  };
  const fonts = presets[name] || [JSON.stringify(name)+",Arial,sans-serif", JSON.stringify(name)+",Arial,sans-serif"];
  const setFonts = (body,heading) => {
    document.documentElement.style.setProperty("--body-font",body);
    document.documentElement.style.setProperty("--heading-font",heading);
  };
  const fontUrl = data.font_url || "";
  if (fontUrl !== currentFontUrl || !fontUrl) {
    currentFontUrl = fontUrl;
    setFonts(fonts[0],fonts[1]);
    const token = ++fontRequest;
    if (fontUrl && /^\/branding\/(?:examples\/[a-z0-9-]{1,40}\/)?font\.woff2\?v=\d+$/.test(fontUrl)) {
      const face = new FontFace("KioskCustomer"+token,
        'url("'+fontUrl+'") format("woff2")');
      face.load().then(loaded => {
        if (token !== fontRequest) return;
        document.fonts.add(loaded);
        setFonts('"'+loaded.family+'",'+fonts[0],'"'+loaded.family+'",'+fonts[1]);
      }).catch(err => console.warn("customer font unavailable",err));
    }
  }
  const wanted = Number(data.slide_seconds);
  const next = Number.isFinite(wanted) && wanted >= 5 ? wanted : 20;
  if (timer === null || seconds !== next) {
    seconds = next;
    if (timer) clearInterval(timer);
    timer = setInterval(show, seconds*1000);
  }
  clock();
}
async function update() {
  try {
    const url = "/api/articles" + (demoProfile ? "?demo="+encodeURIComponent(demoProfile) : "");
    const response = await fetch(url,{cache:"no-store"});
    if (!response.ok) throw Error("HTTP "+response.status);
    const data = await response.json();
    applySettings(data);
    const incoming = Array.isArray(data.articles) ? data.articles : [];
    if (!incoming.length) {
      articles = [];
      displayedId = "";
      el("headline").textContent = "Warte auf RSS-Nachrichten …";
      el("summary").textContent = "";
      el("counter").textContent = "";
      ++photoRequest;
      el("picture").style.display = "none";
      el("story").classList.add("no-picture");
      return;
    }
    const old = incoming.findIndex(item => item.id === displayedId);
    articles = incoming;
    if (old < 0) { index = 0; show(); }
    else { index = (old+1)%articles.length; }
  } catch (e) {
    if (!articles.length) el("headline").textContent = "RSS derzeit nicht erreichbar – versuche es erneut …";
    console.warn("RSS update failed",e);
  }
}
clock();
update();
setInterval(clock,1000);
setInterval(update,30000);
</script>
</body>
</html>
