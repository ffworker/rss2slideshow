# From supplied Logserv / group palette: Reinorange #ec6608, Verkehrsgelb #ffdd00.
brand_name: "Bistro Connect"
accent_color: "#242424"       # black is readable against the bright yellow news area
header_color: "#ec6608"       # group orange / the darker yellow requested for the header
footer_color: "#ec6608"
background_color: "#ffdd00"   # lighter yellow behind news
text_color: "#171717"
font_family: Calibri
logo_mode: wide              # whole company group's horizontal logo, not the bistro logo
