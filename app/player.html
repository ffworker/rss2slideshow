<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>rss2slideshow player</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#101827;color:white;font-family:system-ui,sans-serif;overflow:hidden}
#slide{width:100vw;height:100vh;object-fit:contain;display:none}
#empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:2rem}
#status{position:absolute;right:1rem;bottom:1rem;background:#0008;padding:.3rem .6rem;border-radius:.3rem;font-size:.8rem}
</style></head><body><div id="empty">waiting for slides...<br>check the server logs if this stays here</div>
<img id="slide" alt="slideshow image"><div id="status">starting</div>
<script>
let items=[],index=0,last="";
const image=document.getElementById("slide"),empty=document.getElementById("empty"),status=document.getElementById("status");
async function update(){
 try{
  const r=await fetch("/api/playlist",{cache:"no-store"});
  if(!r.ok)throw Error("playlist: "+r.status);
  const data=await r.json();
  if(data.items.length){
    const current=items[index]||"";
    items=data.items;
    const n=items.indexOf(current);
    if(n>=0)index=n; else index=index%items.length;
    empty.style.display="none";
    status.textContent=items.length+" slides";
    if(!last)show();
  } else status.textContent="no slides yet";
 }catch(e){status.textContent=e.message}
}
function show(){
 if(!items.length)return;
 const next=items[index%items.length];
 if(next!==last){image.src=next;last=next}
 image.style.display="block";
 index=(index+1)%items.length;
}
image.onerror=()=>{status.textContent="could not load slide";last="";setTimeout(show,1000)};
update();setInterval(show,Number(document.documentElement.dataset.duration||15000));setInterval(update,60000);
</script></body></html>
