# Public demo approved by the customer. /demo/logserv only.
# One kiosk, one feed list. Only the LOOK changes in the demo.
brand_name: "Bistro Connect"
tagline: "meet · eat · chill"
layout: bistro
font_family: Calibri     # fallback: Carlito / Arial; no proprietary font in git
accent_color: "#ec6608"
header_color: "#ffef85" # yellow-first header, orange stays a small accent
footer_color: "#ffdd00"
background_color: "#fff8cf" # warmer yellow, not full saturated everywhere
text_color: "#202020"
logo_mode: normal
# logo.png = Bistro Connect icon (primary)
# claim-logo.png = Friedrich Friedrich with claim, in the header if it fits
# company names are real text instead of the tiny almost-invisible PNG
footer_names:
  - "Logserv"
  - "Friedrich Friedrich"
  - "Höhne-Grass"
  - "J. & G. Adrian"
  - "KS Büromöbel"
# no "guten Appetit" overlay in the first branding round
